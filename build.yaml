# This file generates the GitHub Actions matrix, and is what `just build <expr>`
# filters on locally.
#
# LotusUni is a dongle-based keyboard:
#
#   lotus_uni_dongle.uf2      -> XIAO BLE dongle (split central + Prospector RING)
#   lotus_uni_peripheral.uf2  -> keyboard PCB (split peripheral)
#
# Keylink Studio talks to the dongle over USB Raw HID.
#
# A dongle-less standalone BLE build was investigated and abandoned: Host Link
# needs 64 byte packets, and this keyboard's BLE link has too little margin to
# carry them reliably on battery. See docs/ble-hostlink-findings.md for the
# investigation. The shield is kept but is deliberately not built here.
---
include:
  - board: xiao_ble//zmk
    shield: lotus_uni_dongle prospector_adapter raw_hid_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: lotus_uni_dongle
  - board: xiao_ble//zmk
    shield: lotus_uni_peripherals
    artifact-name: lotus_uni_peripheral

  # ── 設定リセット ──
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: lotus_uni_settings_reset
