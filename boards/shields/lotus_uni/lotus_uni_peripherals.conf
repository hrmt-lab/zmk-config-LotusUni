# スプリット ペリフェラル設定
CONFIG_ZMK_SPLIT=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# # CR2032 非LiPoバッテリー管理
# CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
# # CONFIG_ADC=y

# # CR2032 電圧範囲（R1=1MΩ, R2=470kΩ 分圧後のADCピン電圧）
# # 3.0V (満充電) × 470/1470 ≈ 960mV
# # 2.0V (空)     × 470/1470 ≈ 640mV
# CONFIG_ZMK_NON_LIPO_MAX_MV=960
# CONFIG_ZMK_NON_LIPO_MIN_MV=640
# CONFIG_ZMK_NON_LIPO_LOW_MV=610

# # 未接続時スリープまでの時間 (ms) — CR2032節電のため短めに設定
# CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=30000
