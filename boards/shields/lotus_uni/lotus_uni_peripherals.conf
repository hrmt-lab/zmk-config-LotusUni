# ─────────────────────────────────────────────────────────────────────────────
# LotusUni — keyboard PCB in dongle mode (split peripheral)
#
# This build has no Host Link of its own: it forwards key positions to
# lotus_uni_dongle, which is the Keylink Studio endpoint. CONFIG_RAW_HID cannot
# be enabled here anyway (it depends on !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL).
# ─────────────────────────────────────────────────────────────────────────────

CONFIG_ZMK_SLEEP=n

# Sent to the dongle, which forwards it as BATTERY_STATUS source 1.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
