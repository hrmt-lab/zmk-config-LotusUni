# ─────────────────────────────────────────────────────────────────────────────
# LotusUni — dongle (XIAO BLE + Prospector RING)
#
# Split central and Keylink Studio endpoint. Host Link v2 packets travel over
# the USB Raw HID interface. lotus_uni_peripherals is the keyboard PCB that
# pairs with this build.
# ─────────────────────────────────────────────────────────────────────────────

CONFIG_ZMK_SLEEP=n

# Pull peripheral battery levels up to the central so they can be sent as
# BATTERY_STATUS source 1.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ───────── Keylink Studio / Host Link v2 ─────────
CONFIG_RAW_HID=y
CONFIG_RAWHID_APP=y

# host -> dongle
CONFIG_RAWHID_APP_LAYER_CONTROL=y
CONFIG_RAWHID_APP_TIME_SYNC=y
CONFIG_RAWHID_APP_AI_USAGE=y

# dongle -> host
CONFIG_RAWHID_APP_LAYER_STATE_REPORT=y
CONFIG_RAWHID_APP_BATTERY_REPORT=y
CONFIG_RAWHID_APP_HOST_ACTION=y
CONFIG_RAWHID_APP_KEY_STATS=y
CONFIG_RAWHID_APP_KEY_PRESS=y

# Config RPC: encoder / combo inspection and editing from Keylink Studio.
CONFIG_RAWHID_APP_CONFIG_RPC=y
CONFIG_RAWHID_APP_COMBO_RUNTIME=y
CONFIG_RAWHID_APP_COMBO_SETTINGS=y

# Combo Settings stores its fixed table in the NVS settings backend.
CONFIG_SETTINGS=y
CONFIG_NVS=y

# ───────── Prospector RING status screen ─────────
CONFIG_PROSPECTOR_STATUS_SCREEN_RING=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=60
CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=n
CONFIG_PROSPECTOR_DISPLAY_IDLE_TIMEOUT=300
CONFIG_PROSPECTOR_BRIGHTNESS_KEY_CONTROL=y
CONFIG_PROSPECTOR_RING_DARK_TOGGLE_TOUCH=y
CONFIG_PROSPECTOR_RING_DARK_TOGGLE_KEY=y
CONFIG_PROSPECTOR_RING_DARK_TOGGLE_KEYCODE=111
CONFIG_PROSPECTOR_RING_LAST_KEY_DISPLAY=y
CONFIG_PROSPECTOR_RING_GESTURE_NAV=y

# Touch disabled -> never select the CST816S touch driver.
CONFIG_PROSPECTOR_DISPLAY_TOUCH_WAKE=n

# AI Usage screen (long-press F21 = keycode 112, or long-press touch).
CONFIG_PROSPECTOR_RING_AI_USAGE=y
CONFIG_PROSPECTOR_RING_AI_USAGE_TOGGLE_KEY=y
CONFIG_PROSPECTOR_RING_AI_USAGE_TOGGLE_KEYCODE=112
CONFIG_PROSPECTOR_RING_AI_USAGE_TOGGLE_TOUCH=y

# ───────── ZMK Studio ─────────
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
