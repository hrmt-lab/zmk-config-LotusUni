# ─────────────────────────────────────────────────────────────────────────────
# LotusUni — standalone BLE keyboard (no dongle)
#
# NOT BUILT. This target is deliberately absent from build.yaml: Host Link over
# BLE could not be made reliable on battery. See
# docs/ble-hostlink-findings.md for the full investigation.
# The settings below already include everything that investigation established
# as necessary, so a retry starts from here rather than from scratch.
#
# The keyboard PCB itself is the Keylink Studio endpoint. Because this build is
# not a split keyboard, CONFIG_RAW_HID can be enabled here directly, and Host
# Link v2 packets travel over BLE HOG when running on battery, or over the USB
# Raw HID interface when the cable is plugged in.
# ─────────────────────────────────────────────────────────────────────────────

CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Keep the radio up so the Keylink Studio link is not dropped by deep sleep.
CONFIG_ZMK_SLEEP=n

# Own battery level, reported to the host as BATTERY_STATUS source 0.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ───────── Keylink Studio / Host Link v2 ─────────
CONFIG_RAW_HID=y
CONFIG_RAWHID_APP=y

# host -> keyboard
CONFIG_RAWHID_APP_LAYER_CONTROL=y

# TIME_SYNC and AI_USAGE only retain state for a display to render. This build
# has no display, so they stay off; enable them if a screen is ever added.
# CONFIG_RAWHID_APP_TIME_SYNC=y
# CONFIG_RAWHID_APP_AI_USAGE=y

# keyboard -> host
CONFIG_RAWHID_APP_LAYER_STATE_REPORT=y
CONFIG_RAWHID_APP_BATTERY_REPORT=y
CONFIG_RAWHID_APP_HOST_ACTION=y
CONFIG_RAWHID_APP_KEY_STATS=y
CONFIG_RAWHID_APP_KEY_PRESS=y

# Config RPC: encoder / combo inspection and editing from Keylink Studio.
CONFIG_RAWHID_APP_CONFIG_RPC=y
CONFIG_RAWHID_APP_COMBO_RUNTIME=y
CONFIG_RAWHID_APP_COMBO_SETTINGS=y

# Combo Settings stores its fixed table in the NVS settings backend.
CONFIG_SETTINGS=y
CONFIG_NVS=y

# ───────── BLE transport sizing for Host Link ─────────
# A Host Link packet is 64 bytes and must fit in a single ATT PDU, otherwise the
# default ATT MTU of 23 truncates every notify/write and the link never
# handshakes. The local ATT MTU is MIN(BT_BUF_ACL_RX_SIZE - 4, BT_L2CAP_TX_MTU),
# so both have to be raised:
#   notify : 1 (opcode) + 2 (handle) + 64                   = 67
#   write  : 1 (opcode) + 2 (handle) + 1 (report id) + 64   = 68
CONFIG_BT_L2CAP_TX_MTU=69
CONFIG_BT_BUF_ACL_TX_SIZE=73
CONFIG_BT_BUF_ACL_RX_SIZE=73
CONFIG_BT_BUF_ACL_TX_COUNT=6

# ───────── Radio margin (from the 2026-09-20 investigation) ─────────
# nRF52840 tops out at +8 dBm; ZMK defaults to 0 dBm. Host Link's 64 byte
# packets need every dB available. Do NOT disable 2M PHY: it halves air time
# and measurably helped here.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ───────── ZMK Studio ─────────
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Studio RPC and Raw HID share the system workqueue; give them headroom.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
